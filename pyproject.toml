[project]
name = "nexus-brain"
version = "1.5.0"
description = "Nexus personal AI brain"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "python-dotenv>=1.0",
  "ddgs>=9.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
voice = [
  "livekit-agents~=1.8",
  "livekit-api>=1.0",
  "livekit-plugins-openai~=1.8",
  "livekit-plugins-silero~=1.8",
  "livekit-plugins-deepgram~=1.8",
  "livekit-plugins-elevenlabs~=1.8",
]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.0",
  "httpx>=0.27",
]
sandbox = [
  "docker>=7.0",
]
